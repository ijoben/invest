<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Halaman Tidak Ditemukan | AUTOTRADING</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#C89338">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23C89338'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: #0B111E;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .error-card {
      background: linear-gradient(145deg, #131C2E 0%, #0F172A 100%);
      border: 1px solid rgba(200, 147, 56, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(200, 147, 56, 0.1);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 36px 24px;
      text-align: center;
      position: relative;
    }
    .badge-icon-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: rgba(200, 147, 56, 0.12);
      border: 1px solid rgba(200, 147, 56, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C89338;
      box-shadow: 0 10px 25px rgba(200, 147, 56, 0.2);
    }
    .error-code {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #F59E0B 0%, #C89338 50%, #EAB308 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .error-desc {
      font-size: 13.5px;
      color: #94A3B8;
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #D4A348 0%, #B88228 100%);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(200, 147, 56, 0.35);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-action-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(200, 147, 56, 0.45);
    }
    .btn-action-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #CBD5E1;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }
    .brand-foot {
      margin-top: 24px;
      font-size: 11px;
      color: #64748B;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="badge-icon-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Halaman Tidak Ditemukan</h1>
    <p class="error-desc">
      Alamat URL yang Anda tuju mungkin salah ketik, sudah dipindahkan, atau telah dinonaktifkan demi keamanan.
    </p>
    <a href="https://autotrading.my.id/" class="btn-action-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Kembali ke Beranda</span>
    </a>
    <a href="https://autotrading.my.id/#support" class="btn-action-secondary" onclick="window.location.href='https://autotrading.my.id/'; return false;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Hubungi Dukungan CS</span>
    </a>
    <div class="brand-foot">
      &copy; 2026 AUTOTRADING Official &bull; Keamanan Terenkripsi
    </div>
  </div>
</body>
</html>
